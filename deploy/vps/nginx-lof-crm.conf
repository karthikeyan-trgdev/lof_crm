# nginx site for LOF CRM (installed by deploy/vps/server-setup.sh, which replaces __DOMAIN__ and __PORT__).
# certbot adds the HTTPS server block. See DEPLOY-VPS.md.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;

    # wrangler's local runtime serves its scheduled-event trigger and data explorer under /cdn-cgi/ –
    # they must never be reachable from outside (the cron job calls them on 127.0.0.1 directly).
    location ^~ /cdn-cgi/ { return 404; }
    location = /__scheduled { return 404; }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The CRM reads the client address from CF-Connecting-IP (rate limits, session log)
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
