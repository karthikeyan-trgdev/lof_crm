#### LOF CRM behind OpenLiteSpeed (CyberPanel). See DEPLOY-VPS.md, "Servers with CyberPanel".

#### 1. CyberPanel → Websites → List Websites → Manage (your CRM domain) → vHost Conf – add at the end:
extprocessor lofcrm {
  type                    proxy
  address                 127.0.0.1:__PORT__
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

#### 2. Same page → Rewrite Rules – replace the contents with:
RewriteEngine On
# wrangler's scheduled-event trigger and data explorer must never be public
RewriteRule ^/?(cdn-cgi/|__scheduled) - [F,L]
# Let's Encrypt validation stays on this server
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTPS} !=on
RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^(.*)$ http://lofcrm/$1 [P,L]
