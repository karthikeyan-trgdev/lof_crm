<!doctype html><meta charset="utf-8"><title>Lab of Future CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy sidebar + sticky top bar + scrolling work area; light panels on a cool-grey ground */
:root{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#f8f9fc;--line:#e1e6ee;--line2:#edf0f5;
  --fg:#1b2633;--muted:#5d6a7a;--faint:#8793a3;
  --navy:#1d3557;--accent:#2d5b9a;--accent-h:#254d84;--accent-soft:#e7eef8;
  --side:#13243b;--side-fg:#c7d2e1;--side-act:#223a5c;--side-line:#223652;
  --ok:#3a7556;--ok-bg:#e5f1ea;--warn:#9a6c17;--warn-bg:#f8efdb;--crit:#a2403c;--crit-bg:#f7e5e3;--info:#355f95;--info-bg:#e6eef8;--neu:#5d6a7a;--neu-bg:#eceff4;
  --shadow:0 1px 2px rgba(20,35,60,.06);--shadowM:0 12px 40px rgba(15,25,45,.22);
  --c1:#2d5b9a;--c2:#7c9cc4;--c3:#b7c7dc;--c4:#6a8f7a;--c5:#b98a45;--c6:#a05d59;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1621;--panel:#16212f;--panel2:#1a2635;--line:#2a3a4f;--line2:#223144;--fg:#e2e8f0;--muted:#97a5b7;--faint:#74849a;
  --navy:#9db8de;--accent:#6c9bd8;--accent-h:#86adE3;--accent-soft:#1f3350;--side:#0b141f;--side-fg:#b4c1d3;--side-act:#1a2c44;--side-line:#1b2a3d;
  --ok:#78b896;--ok-bg:#1b3027;--warn:#d4a64f;--warn-bg:#352b15;--crit:#e08a85;--crit-bg:#3a1f1e;--info:#86adE3;--info-bg:#1c2f49;--neu:#97a5b7;--neu-bg:#223144;
  --shadow:none;--shadowM:0 12px 40px rgba(0,0,0,.5);--c1:#6c9bd8;--c2:#4f77a8;--c3:#34506f;--c4:#78b896;--c5:#d4a64f;--c6:#e08a85;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1621;--panel:#16212f;--panel2:#1a2635;--line:#2a3a4f;--line2:#223144;--fg:#e2e8f0;--muted:#97a5b7;--faint:#74849a;
  --navy:#9db8de;--accent:#6c9bd8;--accent-h:#86adE3;--accent-soft:#1f3350;--side:#0b141f;--side-fg:#b4c1d3;--side-act:#1a2c44;--side-line:#1b2a3d;
  --ok:#78b896;--ok-bg:#1b3027;--warn:#d4a64f;--warn-bg:#352b15;--crit:#e08a85;--crit-bg:#3a1f1e;--info:#86adE3;--info-bg:#1c2f49;--neu:#97a5b7;--neu-bg:#223144;
  --shadow:none;--shadowM:0 12px 40px rgba(0,0,0,.5);--c1:#6c9bd8;--c2:#4f77a8;--c3:#34506f;--c4:#78b896;--c5:#d4a64f;--c6:#e08a85;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13.5px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12px}.xs{font-size:11px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.shell.collapsed{grid-template-columns:62px minmax(0,1fr)}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--side-line);height:56px}
.brand .logo{width:28px;height:28px;border-radius:6px;background:#2d5b9a;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.brand b{color:#fff;font-weight:600;letter-spacing:.2px;white-space:nowrap}.brand small{display:block;color:#8ea2bd;font-size:11px;white-space:nowrap}
.nav{overflow:auto;flex:1;padding:8px 8px 16px}
.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#7f93ae;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.nav a.it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--side-fg);cursor:pointer;white-space:nowrap}
.nav a.it:hover{background:var(--side-act)}
.nav a.it.on{background:var(--side-act);color:#fff;box-shadow:inset 2px 0 0 #6c9bd8}
.nav a.it .cnt{margin-left:auto;background:#2d4a70;color:#dbe6f5;border-radius:9px;padding:0 7px;font-size:11px}
.nav a.it .cnt.crit{background:#8c3a36;color:#fff}
.collapsed .brand div,.collapsed .nav h6,.collapsed .nav a.it span,.collapsed .nav a.it .cnt{display:none}
.collapsed .nav a.it{justify-content:center}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:none}
.top .search{flex:1;max-width:460px;position:relative}
.top .search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.top .search .ico{position:absolute;left:10px;top:9px;color:var(--faint)}
.sr{position:absolute;left:0;right:0;top:38px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadowM);z-index:30;max-height:360px;overflow:auto}
.sr div{padding:8px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:8px;align-items:center}.sr div:hover{background:var(--panel2)}
.top .sp{flex:1}
.iconbtn{position:relative;background:none;border:1px solid transparent;border-radius:6px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--panel2);border-color:var(--line)}
.iconbtn .dot{position:absolute;top:2px;right:0;background:var(--crit);color:#fff;border-radius:9px;font-size:10px;min-width:16px;padding:0 4px;text-align:center;line-height:16px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none}
.pm{position:relative}
.menu{position:absolute;right:0;top:40px;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadowM);z-index:40;padding:6px}
.menu .mi{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}.menu .mi:hover{background:var(--panel2)}
.menu .mh{padding:8px 10px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.menu .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);padding:6px 10px 2px}
.content{flex:1;overflow:auto;padding:18px 22px 40px}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:6px;padding:7px 12px;font-size:12px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{margin:0;font-size:19px;font-weight:600;color:var(--navy);letter-spacing:.1px}
.ph p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card>.hd{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card>.hd h3{margin:0;font-size:13.5px;font-weight:600}
.card>.bd{padding:14px}
.card>.bd.np{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--accent)}
.kpi .l{color:var(--muted);font-size:12px}.kpi .v{font-size:22px;font-weight:600;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--faint)}
.kpi.warn .v{color:var(--warn)}.kpi.crit .v{color:var(--crit)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-h)}
html[data-theme="dark"] .btn.primary{color:#0b1420}
.btn.danger{color:var(--crit)}.btn.danger:hover{background:var(--crit-bg)}
.btn.sm{padding:3px 9px;font-size:12px}.btn[disabled],.btn.disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--panel2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--neu-bg);color:var(--neu)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.crit{background:var(--crit-bg);color:var(--crit)}.badge.info{background:var(--info-bg);color:var(--info)}
.sim{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 5px}
.tbl-wrap{overflow:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--panel2);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--fg)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.cl{cursor:pointer}.tbl tr.cl:hover td{background:var(--panel2)}
.tbl td.r,.tbl th.r{text-align:right}
.pager{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--line2);color:var(--muted);font-size:12px;gap:8px;flex-wrap:wrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--fg);margin-bottom:4px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.tb input,.tb select,.fi,.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 9px;min-width:0}
.tb input[type=search]{min-width:200px}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.nav a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow:auto;margin-bottom:14px}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--fg)}.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg a{padding:5px 12px;cursor:pointer;color:var(--muted);background:var(--panel)}.seg a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f.full{grid-column:1/-1}
.f>label{font-size:12px;color:var(--muted);font-weight:500}.f>label i{color:var(--crit);font-style:normal}
.f .help{font-size:11.5px;color:var(--faint)}
.fe{color:var(--crit);font-size:11.5px;min-height:0}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--crit)}
.chk{display:flex;gap:8px;align-items:center}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:600;margin:16px 0 8px;grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;box-shadow:var(--shadowM);width:min(100%,640px);max-height:calc(100% - 20px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.lg{width:min(100%,860px)}.modal.sm2{width:min(100%,440px)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .mh h3{margin:0;font-size:15px;font-weight:600;color:var(--navy)}
.modal .mb{padding:16px 18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadowM);font-size:13px;border-left:4px solid #6c9bd8}
html[data-theme="dark"] .toast{color:#0b1420}
.toast.ok{border-left-color:#5fae86}.toast.err{border-left-color:#e08a85}.toast.warn{border-left-color:#d4a64f}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 14px}.tl .ev:before{content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--c2)}
.tl .ev.call:before{border-color:var(--c1)}.tl .ev.msg:before{border-color:var(--c4)}.tl .ev.warn:before{border-color:var(--c5)}.tl .ev.crit:before{border-color:var(--c6)}
.tl .ev .t{color:var(--faint);font-size:11.5px}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow:auto;padding-bottom:8px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:200px;max-height:calc(100vh - 260px)}
.kcol.over{outline:2px dashed var(--accent)}
.kcol>h4{margin:0;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between}
.kcol .kl{padding:0 8px 8px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 10px;cursor:pointer}
.kc:hover{border-color:var(--accent)}.kc .n{font-weight:600}.kc[draggable=true]{cursor:grab}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) 1fr 54px;gap:8px;align-items:center;cursor:default}
.bar.cl{cursor:pointer}.bar.cl:hover .tr i{filter:brightness(.9)}
.bar .tr{background:var(--line2);height:16px;border-radius:3px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--c1);border-radius:3px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:6px}
.fn{display:flex;align-items:center;gap:10px;cursor:pointer}.fn .bx{height:28px;background:var(--c1);border-radius:4px;color:#fff;padding:0 10px;display:flex;align-items:center;min-width:44px;font-variant-numeric:tabular-nums;font-weight:500}
html[data-theme="dark"] .fn .bx{color:#0b1420}
.fn span.n{width:112px;flex:none;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.donutw{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line2);border-top:1px solid var(--line2)}
.cal .dh{padding:6px;font-size:11px;color:var(--faint);text-transform:uppercase;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--panel2)}
.cal .d{min-height:84px;padding:5px 6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);cursor:pointer;font-size:12px}
.cal .d:hover{background:var(--panel2)}.cal .d.today{background:var(--accent-soft)}.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px}.cal .d.out{opacity:.4}
.cal .ch{display:block;margin-top:2px;padding:0 5px;border-radius:3px;background:var(--info-bg);color:var(--info);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ch.od{background:var(--crit-bg);color:var(--crit)}.cal .ch.dn{background:var(--ok-bg);color:var(--ok)}
.sum{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:14px;align-items:center}
.sum .it{min-width:0}.sum .it small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 11px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.step{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.step div{padding:6px 12px;border-radius:14px;background:var(--neu-bg);color:var(--muted);font-size:12.5px}.step div.on{background:var(--accent);color:#fff}.step div.dn{background:var(--ok-bg);color:var(--ok)}
html[data-theme="dark"] .step div.on{color:#0b1420}
.callpop{position:fixed;right:18px;top:68px;z-index:150;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;box-shadow:var(--shadowM);padding:14px 16px;width:min(340px,calc(100% - 36px))}
.sw{position:relative;display:inline-block;width:34px;height:19px;flex:none}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;background:var(--line);border-radius:10px;cursor:pointer;transition:.15s}.sw i:before{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}.sw input:checked+i{background:var(--accent)}.sw input:checked+i:before{transform:translateX(15px)}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
.pc{display:inline-block;width:22px;height:20px;border:1px solid var(--line);border-radius:4px;margin:0 1px;font-size:10.5px;line-height:18px;cursor:pointer;color:var(--faint);user-select:none}.pc.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rcpt{border:1px solid var(--line);border-radius:6px;padding:18px;background:var(--panel2)}
.rcpt h4{margin:0 0 2px;color:var(--navy)}.rcpt hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
.list>div{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2);align-items:center}

function leadTab(l,tab){const calls=S.calls.filter(c=>c.lead===l.id),tasks=S.tasks.filter(t=>t.lead===l.id),opps=S.opps.filter(o=>o.lead===l.id),comms=S.comms.filter(c=>c.lead===l.id).sort((a,b)=>new Date(b.at)-new Date(a.at)),edit=can('leads','E')&&l.status==='Open';
  if(tab==='overview')return`<div class="grid g2"><div>${card('Activity timeline',timeline(l.events))}</div><div class="grid">${card('Snapshot',dl([['Source',esc(l.src)],['Campaign',esc(l.camp)],['Enquiry',fDT(l.enq)+' · '+rel(l.enq)],['Last activity',rel(l.last)],['Programme interest',(l.interests||[l.prog]).map(PNAME).join(', ')],['Open task',openTask(l)?esc(openTask(l).type)+' · '+fDT(openTask(l).due):'—'],['Consents','WhatsApp '+(l.wa?'✓':'✗')+' · Email '+(l.em?'✓':'✗')],['Notes',esc(l.notes)]]))}${l.status==='Open'?card('Follow-up rule for '+l.cat,S.cfg.cad[l.cat]?`<p class="sm" style="margin:0">Initial follow-up within <b>${S.cfg.cad[l.cat].h} h</b>, then every <b>${S.cfg.cad[l.cat].every} days</b>${S.cfg.cad[l.cat].forD?' for '+S.cfg.cad[l.cat].forD+' days':''}. Editable under SLA & Follow-up Rules.</p>`:l.cat==='No Response'?`<p class="sm" style="margin:0">Attempt <b>${l.noResp} of ${S.cfg.life.noRespMax}</b>. The lead closes automatically after ${S.cfg.life.noRespMax} unanswered attempts. Retries follow the original category (${esc(l.origCat||'—')}).</p>`:'<p class="sm" style="margin:0">No follow-up. A standardised reason is mandatory.</p>'):''}</div></div>`;
  if(tab==='parent')return`<div class="grid g2">${card('Student',dl([['Name',esc(l.student)],['Date of birth',l.dob?fD(l.dob)+' (age '+age(l.dob)+')':'—'],['Age',l.age||'—'],['School',esc(l.school)],['Grade',esc(l.grade)],['Curriculum',esc(l.curr)]]),{act:can('leads','E')?`<button class="btn sm" data-act="mEditLead" data-id="${l.id}">Edit</button>`:''})}${card('Parent / guardian',dl([['Name',esc(l.parent)],['Mobile','<span class="mono">'+esc(l.phone)+'</span> <button class="btn sm ghost" data-act="copy" data-v="'+esc(l.phone)+'">Copy</button>'],['Email',esc(l.email)]]))}${S.cfg.fields.length?card('Custom fields',dl(S.cfg.fields.map(f=>[f.n,esc((l.custom||{})[f.n])]))):''}</div>`;
  if(tab==='activity')return card('Call log',table('lcalls',[{h:'Date',f:c=>fDT(c.at)},{h:'Direction',f:c=>c.dir},{h:'From → To',f:c=>`<span class="mono">${esc(c.from)} → ${esc(c.to)}</span>`},{h:'Duration',f:c=>c.dur+' min'},{h:'Status',f:c=>esc(c.status)},{h:'Outcome',f:c=>esc(c.outcome)+(c.first?' '+bdg('First call','info'):'')},{h:'Notes',f:c=>esc(c.notes)+(c.sim?' '+SIMTAG:'')},{h:'Recording',f:c=>c.rec?esc(c.rec):'<span class="faint">—</span>'}],calls,{all:1,et:'No calls logged',ed:'Use Call to log an attempt.'}),{np:1})+'<div style="height:14px"></div>'+card('Timeline',timeline(l.events));
  if(tab==='tasks')return card('Follow-ups & tasks',table('ltasks',taskCols(),tasks,{all:1,et:'No tasks',ed:'Schedule a follow-up to create one.'}),{np:1,act:edit?`<button class="btn sm" data-act="mFu" data-id="${l.id}">Schedule follow-up</button>`:''});
  if(tab==='interests'){const ints=l.interests||[l.prog];const fee=feeFor(S,l.prog,l.branch,'Term (24 sessions)');return`<div class="grid g2">${card('Programme interests',`<div class="chips">${S.programs.filter(p=>p.active).map(p=>`<a class="chip ${ints.includes(p.id)?'on':''}" tabindex="0" data-act="${edit?'leadInt':'noop'}" data-id="${l.id}" data-p="${p.id}">${esc(p.name)}</a>`).join('')}</div><p class="muted sm">Primary interest: <b>${esc(PNAME(l.prog))}</b>.${edit?' Click to add or remove additional interests.':''}</p>`)}${card('Indicative pricing at '+esc(branchName(l.branch)),fee?dl([['Package',esc(fee.pkg)],['Fee',money(fee.amt,fee.cur)],['Registration (new students)',money(fee.extra.amt,fee.cur)],['Tax',fee.tax+'%'],['Sessions',fee.sessions]]):'<p class="muted">No active fee record for this branch and programme.</p>')}</div>`}
  if(tab==='opps')return card('Opportunities',table('lopps',[{h:'Opportunity',f:o=>`<a ${goA('opps')}>${o.id}</a>`},{h:'Programme',f:o=>esc(PNAME(o.prog))},{h:'Stage',f:o=>bdg(o.stage,{Enrolled:'ok',Lost:'crit','Admission Decision':'warn'}[o.stage]||'info')},{h:'Fee',f:o=>{const f=feeFor(S,o.prog,o.branch,o.pkg);return f?money(f.amt,f.cur):'—'}},{h:'Next action',f:o=>esc(o.next)}],opps,{all:1,et:'No opportunity yet',ed:l.stage==='Qualified'?'This lead is qualified. Use Create opportunity.':'Mark the lead Qualified, then convert it.'}),{np:1});
  if(tab==='comms'){const av=l.avail;return`<div class="grid g2"><div>${card('Communication history',table('lcomm',[{h:'Time',f:c=>fDT(c.at)},{h:'Channel',f:c=>esc(c.ch)},{h:'Template',f:c=>esc(c.tpl)},{h:'Message',f:c=>esc(c.text)},{h:'Delivery',f:c=>bdg(c.status,c.status.startsWith('Blocked')?'crit':'info')}],comms,{all:1}),{np:1,act:edit?`<button class="btn sm" data-act="mWa" data-id="${l.id}">WhatsApp</button><button class="btn sm" data-act="mMail" data-id="${l.id}">Email</button>`:''})}</div><div class="grid">${card('Parent call availability',`${!av?`<p class="muted sm" style="margin:0">${l.wa?'No availability request sent yet.':'No WhatsApp consent – the automated request was not sent.'}</p>`:av.s==='Requested'?`<p class="sm" style="margin:0 0 10px">WhatsApp request sent. Waiting for the parent’s preferred time.</p>${edit?`<button class="btn sm" data-act="mAvail" data-id="${l.id}">Simulate parent reply</button>`:''}`:`<p class="sm" style="margin:0 0 8px">Parent prefers <b>${fDT(av.slot)}</b>. ${av.s==='Scheduled'?bdg('Added to follow-ups','ok'):''}</p>${av.s==='Received'&&edit?`<button class="btn primary sm" data-act="schedSlot" data-id="${l.id}">Schedule requested slot</button>`:''}<p class="muted xs">Calendar sync (Google/Outlook) is a configurable placeholder and is not connected. The slot is added to the CRM follow-up calendar.</p>`}`)}${card('Consent status',dl([['WhatsApp',l.wa?bdg('Granted','ok'):bdg('Not granted','crit')],['Email',l.em?bdg('Granted','ok'):bdg('Not granted','crit')],['Automation rule','Messages are blocked without matching consent']]))}</div></div>`}
  if(tab==='assign')return`<div class="grid g2">${card('Assignment history',table('lasg',[{h:'When',f:a=>fDT(a.at)},{h:'From',f:a=>esc(staffName(a.from))},{h:'To',f:a=>esc(staffName(a.to))},{h:'Method',f:a=>esc(a.how)},{h:'By',f:a=>esc(a.by)},{h:'Reason',f:a=>esc(a.reason)}],l.assign.slice().reverse(),{all:1,et:'No assignment yet'}),{np:1})}${card('Branch transfers',table('ltr',[{h:'Request',f:a=>a.id},{h:'From → To',f:a=>esc(branchName(a.payload.from))+' → '+esc(branchName(a.payload.to))},{h:'Status',f:a=>stB(a.status)},{h:'Requested',f:a=>fDT(a.at)}],S.approvals.filter(a=>a.type==='Branch Transfer'&&a.payload.lead===l.id),{all:1,et:'No transfers',ed:'Current branch: '+branchName(l.branch)}),{np:1})}</div>`;
  if(tab==='docs'){const dc=can('student_docs','V');return`<div class="grid g2">${card('Consents',dl([['WhatsApp communication',l.wa?bdg('Granted','ok'):bdg('Not granted','crit')],['Email communication',l.em?bdg('Granted','ok'):bdg('Not granted','crit')],['Captured',fDT(l.enq)+' ('+esc(l.src)+')']])+(can('leads','E')?`<div class="row" style="margin-top:12px"><button class="btn sm" data-act="toggleConsent" data-id="${l.id}" data-k="wa">${l.wa?'Withdraw':'Record'} WhatsApp consent</button><button class="btn sm" data-act="toggleConsent" data-id="${l.id}" data-k="em">${l.em?'Withdraw':'Record'} email consent</button></div>`:''))}${card('Documents',dc?emptyBox('No documents uploaded','Student documents are collected at enrolment and visible in the Student 360° profile.'):emptyBox('Restricted','Student documents are visible to Centre Administrators, Admissions Heads and System Administrators.'))}</div>`}
  if(tab==='audit')return card('Audit trail',table('laud',[{h:'When',f:a=>fDT(a.at)},{h:'User',f:a=>esc(a.by)},{h:'Action',f:a=>esc(a.act)},{h:'Detail',f:a=>esc(a.det)}],S.audit.filter(a=>a.ref===l.id),{all:1,et:'No audited changes yet'}),{np:1});return''}
function taskCols(){return[{h:'Due',f:t=>fDT(t.due)+(t.status==='Pending'&&new Date(t.due)<NOW?' '+bdg('Overdue','crit'):''),s:t=>t.due},{h:'Lead',f:t=>{const l=leadById(t.lead);return`<a ${lgo(l.id)}>${esc(l.student)}</a>`}},{h:'Counsellor',f:t=>esc(staffName(t.cslr))},{h:'Type',f:t=>esc(t.type)},{h:'Status',f:t=>stB(t.status==='Done'?'Completed':t.status==='Cancelled'?'':t.status)+(t.status==='Cancelled'?bdg('Cancelled'):'')},{h:'Remarks / outcome',f:t=>esc(t.outcome||t.remarks)},{h:'',f:t=>t.status==='Pending'&&can('leads','E')?`<button class="btn sm" data-act="mTaskDone" data-id="${t.id}">Complete</button>`:''}]}
Object.assign(ACT,{noop(){},copy(d){navigator.clipboard&&navigator.clipboard.writeText(d.v).then(()=>toast('Copied'),()=>toast('Select the number and copy manually','warn'))},
 mCall:d=>openModal('callLog',{id:d.id}),mWa:d=>openModal('wa',{id:d.id}),mMail:d=>openModal('mail',{id:d.id}),mFu:d=>openModal('fu',{id:d.id}),mCat:d=>openModal('cat',{id:d.id}),mTransfer:d=>openModal('transfer',{id:d.id}),mLost:d=>openModal('lostLead',{id:d.id}),mEditLead:d=>openModal('leadForm',{id:d.id}),mReassign:d=>openModal('reassign',{id:d.id}),mAvail:d=>openModal('avail',{id:d.id}),mTaskDone:d=>openModal('taskDone',{id:d.id}),
 reopen(d){const l=leadById(d.id);l.status='Open';l.closeReason='';l.noResp=0;if(l.cat==='Not Interested'||l.cat==='No Response')l.cat=l.origCat||'Warm';scheduleNext(l,l.cat,true);syncNext(l);addEv(l,'sys','Lead reopened');addAudit('Lead reopened',l.id,'');render();toast('Lead reopened','ok')},
 leadInt(d){const l=leadById(d.id);l.interests=l.interests||[l.prog];const i=l.interests.indexOf(d.p);if(i>=0){if(d.p===l.prog){toast('Primary interest cannot be removed','warn');return}l.interests.splice(i,1)}else l.interests.push(d.p);addAudit('Programme interests changed',l.id,l.interests.join(', '));render()},
 toggleConsent(d){const l=leadById(d.id);l[d.k]=!l[d.k];addEv(l,'sys',(d.k==='wa'?'WhatsApp':'Email')+' consent '+(l[d.k]?'recorded':'withdrawn'));addAudit('Consent changed',l.id,d.k+' → '+l[d.k]);render();toast('Consent updated','ok')},
 schedSlot(d){const l=leadById(d.id);S.tasks.push({id:'T-'+(S.seq.task++),lead:l.id,cslr:l.cslr,due:l.avail.slot,type:'Scheduled call',status:'Pending',remarks:'Parent-requested slot',outcome:'',next:''});l.avail.s='Scheduled';syncNext(l);addEv(l,'sys','Parent-requested slot scheduled as follow-up for '+fDT(l.avail.slot));render();toast('Slot added to the follow-up calendar','ok')},
 startConvert(d){const l=leadById(d.id);if(l.stage!=='Qualified'){confirmBox('Lead is not qualified yet','Only qualified leads convert to opportunities. Mark <b>'+esc(l.student)+'</b> as Qualified now and continue?','qualify',l.id,'Mark Qualified & continue')}else openModal('convert',{id:l.id})}});
CONFIRM.qualify=id=>{const l=leadById(id);l.stage='Qualified';addEv(l,'sys','Stage changed to Qualified');addAudit('Lead stage changed',id,'→ Qualified');openModal('convert',{id})};
/* lead modals */
const OUTC=['Interested – counselling booked','Interested – needs time','Information only','Callback requested','Not interested','Wrong number','No answer'];
MODALS.callLog=m=>{const l=leadById(m.id);return{title:'Log call – '+l.student,form:'callLog',ok:'Save call log',body:`<input type="hidden" name="id" value="${l.id}"><div class="banner">${ic('phone')}<span>Telephony provider: <b>${esc(S.cfg.integ.tel.provider)}</b> – not connected. Calls are logged manually and labelled simulated.</span></div><div class="row" style="margin-bottom:12px"><span class="mono">${esc(l.phone)}</span><span class="muted sm">${esc(l.parent)}</span>${!l.fc?bdg('First call','info'):''}</div><div class="fgrid">${F('Direction','dir',{opts:['Outgoing','Incoming'],v:'Outgoing'})}${F('Call status','status',{opts:['Completed','Not answered','Busy','Voicemail'],v:'Completed'})}${F('Outcome','outcome',{opts:OUTC,blank:'Select outcome',req:1})}${F('Duration (minutes)','dur',{t:'number',min:0,v:0})}${F('Next follow-up (optional)','next',{t:'datetime-local',help:'If empty, the cadence for the category is applied.'})}${F('Call notes','notes',{t:'textarea',full:1})}</div>${l.cat!=='No Response'&&l.noResp?'':''}<p class="muted sm">Choosing “No answer” counts as an unanswered attempt. After ${S.cfg.life.noRespMax} attempts the lead closes automatically.</p>`}};
SUB.callLog=(d,f)=>{if(!need(f,d,['outcome']))return;if(d.outcome==='No answer')d.status='Not answered';else if(d.status!=='Completed'&&d.outcome!=='No answer'){setErr(f,'outcome','Use “No answer” when the call was not connected');return}
  const l=leadById(d.id);const r=logCall(l,d);closeModal();toast(r.closed?'Call logged – lead closed after '+S.cfg.life.noRespMax+' unanswered attempts':'Call logged (simulated telephony)',r.closed?'warn':'ok')};
MODALS.wa=m=>{const l=leadById(m.id);const ts=S.cfg.comms.filter(t=>t.ch==='WhatsApp');return{title:'WhatsApp – '+l.parent,form:'wa',ok:'Send (simulated)',body:`<input type="hidden" name="id" value="${l.id}">${!l.wa?`<div class="banner" style="background:var(--crit-bg);color:var(--crit)">No WhatsApp consent recorded. Sending is blocked until consent is captured.</div>`:`<div class="banner">${ic('chat')}<span>WhatsApp Business is not connected – messages are recorded as simulated.</span></div>`}<div class="fgrid">${F('Template','tpl',{opts:ts.map(t=>[t.id,t.n+(t.auto?' (auto)':'')]),v:ts[0].id,chg:'tplFill'})}${F('Message','text',{t:'textarea',rows:5,full:1,v:msgFrom(ts[0].body,l),req:1})}</div>`}};
MODALS.mail=m=>{const l=leadById(m.id);const ts=S.cfg.comms.filter(t=>t.ch==='Email');return{title:'Email – '+l.parent,form:'mail',ok:'Send (simulated)',body:`<input type="hidden" name="id" value="${l.id}">${!l.em?`<div class="banner" style="background:var(--crit-bg);color:var(--crit)">No email consent recorded. Sending is blocked.</div>`:''}<div class="fgrid">${F('To','to',{v:l.email,dis:1})}${F('Template','tpl',{opts:ts.map(t=>[t.id,t.n]),v:ts[0].id,chg:'tplFill'})}${F('Subject','subj',{v:'Your enquiry at Lab of Future '+branchName(l.branch),req:1,full:1})}${F('Message','text',{t:'textarea',rows:6,full:1,v:msgFrom(ts[0].body,l),req:1})}</div>`}};
CHG.tplFill=el=>{const f=el.form,l=leadById(f.querySelector('[name=id]').value),t=S.cfg.comms.find(x=>x.id===el.value);f.querySelector('[name=text]').value=msgFrom(t.body,l)};
['wa','mail'].forEach(k=>SUB[k]=(d,f)=>{if(!need(f,d,['text']))return;const l=leadById(d.id),wa=k==='wa';if(wa?!l.wa:!l.em){setErr(f,'text','Blocked: no '+(wa?'WhatsApp':'email')+' consent recorded for this contact');return}
  const t=S.cfg.comms.find(x=>x.id===d.tpl);S.comms.push({id:'CM'+(S.seq.cm++),lead:l.id,ch:wa?'WhatsApp':'Email',tpl:t?t.n:'Custom',text:d.text,at:nowIso(),status:'Sent (simulated)',by:me().name});addEv(l,'msg',(wa?'WhatsApp':'Email')+' sent (simulated): '+d.text.slice(0,80)+(d.text.length>80?'…':''));addAudit((wa?'WhatsApp':'Email')+' sent',l.id,'Template '+(t?t.n:'custom'));closeModal();toast((wa?'WhatsApp':'Email')+' recorded as sent (simulated)','ok')});
MODALS.fu=m=>{const l=leadById(m.id);const due=new Date(NOW.getTime()+864e5);return{title:'Schedule follow-up – '+l.student,form:'fu',ok:'Schedule',body:`<input type="hidden" name="id" value="${l.id}"><div class="fgrid">${F('Follow-up type','type',{opts:['Follow-up call','WhatsApp follow-up','Email follow-up','Centre visit','Trial class'],v:'Follow-up call'})}${F('Due date / time','due',{t:'datetime-local',v:locVal(due.toISOString()),req:1})}${F('Assigned counsellor','cs',{v:l.cslr||'',opts:optCslr(l.branch),blank:'Unassigned',dis:1})}${F('Remarks','remarks',{t:'textarea',full:1})}</div>`}};
SUB.fu=(d,f)=>{if(!need(f,d,['due']))return;const l=leadById(d.id);const due=locIso(d.due);if(new Date(due)<NOW){setErr(f,'due','Choose a time in the future');return}S.tasks.push({id:'T-'+(S.seq.task++),lead:l.id,cslr:l.cslr,due,type:d.type,status:'Pending',remarks:d.remarks,outcome:'',next:''});syncNext(l);addEv(l,'sys',d.type+' scheduled for '+fDT(due));addAudit('Follow-up scheduled',l.id,d.type+' '+fDT(due));closeModal();toast('Follow-up scheduled for '+fDT(due),'ok')};
MODALS.cat=m=>{const l=leadById(m.id);return{title:'Change category – '+l.student,form:'cat',ok:'Update category',body:`<input type="hidden" name="id" value="${l.id}"><div class="fgrid">${F('Current category','cur',{v:l.cat,dis:1})}${F('New category','cat',{opts:CATS,v:l.cat,req:1})}${F('Reason (mandatory for Not Interested)','reason',{opts:S.cfg.life.niReasons,blank:'Select reason',full:1})}</div><p class="muted sm">Hot/Warm/Cold create the next follow-up from the configured cadence. Not Interested closes the lead and cancels open tasks. No Response starts the unanswered-attempt counter.</p>`}};
SUB.cat=(d,f)=>{const l=leadById(d.id);clearErrs(f);if(d.cat===l.cat){setErr(f,'cat','Choose a different category');return}if(d.cat==='Not Interested'&&!d.reason){setErr(f,'reason','A standardised reason is mandatory for Not Interested');return}changeCat(l,d.cat,d.reason);closeModal();toast('Category changed to '+d.cat+(S.cfg.cad[d.cat]?' – follow-up scheduled':''),'ok')};
MODALS.lostLead=m=>{const l=leadById(m.id);return{title:'Mark as lost – '+l.student,form:'lostLead',ok:'Mark as lost',danger:1,body:`<input type="hidden" name="id" value="${l.id}"><div class="fgrid">${F('Lost reason','reason',{opts:S.cfg.life.lostReasons,blank:'Select reason',req:1,full:1})}${F('Remarks','remarks',{t:'textarea',full:1})}</div>`}};
SUB.lostLead=(d,f)=>{if(!need(f,d,['reason']))return;const l=leadById(d.id);l.status='Lost';l.lostReason=d.reason;cancelTasks(l,'Lead lost');l.nextFU=null;addEv(l,'warn','Marked as lost – '+d.reason+(d.remarks?' · '+d.remarks:''));addAudit('Lead lost',l.id,d.reason);closeModal();toast('Lead marked as lost','ok')};
MODALS.convert=m=>{const l=leadById(m.id);const fees=S.fees.filter(x=>x.active&&x.prog===l.prog&&x.branch===l.branch);return{title:'Create opportunity – '+l.student,form:'convert',ok:'Create opportunity',body:`<input type="hidden" name="id" value="${l.id}">${!fees.length?'<div class="banner" style="background:var(--crit-bg);color:var(--crit)">No active fee record for this branch and programme. Add pricing under Fees & Pricing.</div>':''}<div class="fgrid">${F('Programme','p',{v:PNAME(l.prog),dis:1})}${F('Package','pkg',{opts:fees.map(x=>[x.pkg,x.pkg+' – '+money(x.amt,x.cur)]),req:1,chg:'convFee'})}${F('Expected enrolment date','exp',{t:'date',v:dayKey(dAt(7,0)),req:1})}${F('Next action','next',{v:'Send fee breakdown and book enrolment slot'})}</div><div id="convFee" style="margin-top:12px">${fees[0]?feeBox(fees[0],null,true):''}</div><p class="muted sm">Once converted, the lead is excluded from open-lead workload calculations.</p>`}};
function feeBox(f,disc,isNew){const c=calcFee(f,disc,isNew);return`<div class="card"><div class="bd"><dl class="kv"><dt>Package fee</dt><dd class="num">${money(c.base,f.cur)}</dd><dt>Registration (new students)</dt><dd class="num">${money(c.extra,f.cur)}</dd><dt>Discount</dt><dd class="num">− ${money(c.disc,f.cur)}</dd><dt>Tax (${f.tax}%)</dt><dd class="num">${money(c.tax,f.cur)}</dd><dt><b>Total payable</b></dt><dd class="num"><b>${money(c.total,f.cur)}</b></dd></dl></div></div>`}
CHG.convFee=el=>{const l=leadById(el.form.querySelector('[name=id]').value);const f=feeFor(S,l.prog,l.branch,el.value);$('#convFee').innerHTML=f?feeBox(f,null,true):''};

SUB.cfg_life=(d,f)=>{const L=S.cfg.life;const lost=d.lost.split('\n').map(x=>x.trim()).filter(Boolean),ni=d.ni.split('\n').map(x=>x.trim()).filter(Boolean);if(!lost.length||!ni.length){toast('Keep at least one reason in each list','err');return}if(!(+d.nr>=1)){toast('Attempt limit must be at least 1','err');return}

SUB.cfg_sla=(d,f)=>{if(!need(f,d,['mins','warnPct','escMins']))return;if(+d.mins<1||+d.warnPct>=100||+d.warnPct<1){toast('SLA must be ≥1 minute and the warning threshold between 1 and 99%','err');return}if(+d.escMins<+d.mins){setErr(f,'escMins','Escalation must be at or after the SLA time');return}
  const s=S.cfg.sla;Object.assign(s,{mins:+d.mins,warnPct:+d.warnPct,escMins:+d.escMins,escTo:d.escTo,remindMins:+d.remindMins,biz:d.biz});for(const k of ['Hot','Warm','Cold']){const h=+d['h_'+k],e=+d['e_'+k],fo=+d['f_'+k];if(!(h>0)||!(e>0)||fo<0||isNaN(fo)){toast('Check cadence values for '+k,'err');return}S.cfg.cad[k]={h,every:e,forD:fo}}cfgSave('SLA & follow-up rules','SLA '+d.mins+' min, warn '+d.warnPct+'%')};

const curMonth=()=>TODAY.slice(0,7);
const monthAdd=(m,n)=>{const p=m.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1+n,1)).toISOString().slice(0,7)};
const monthName=m=>new Date(m+'-15T12:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
const addDays=(day,n)=>new Date(Date.parse(day+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
const addMonthsDay=(day,n)=>{const p=day.split('-').map(Number);const last=new Date(Date.UTC(p[0],p[1]+n,0,12)).getUTCDate();return new Date(Date.UTC(p[0],p[1]-1+n,Math.min(p[2],last),12)).toISOString().slice(0,10)};
const dayFmt=d=>d?fD(d+'T12:00:00+04:00'):'—';
const brCur=b=>((S.branches.find(x=>x.id===b))||{cur:'AED'}).cur;

/* seed data for the new settings (called from seed()) */
function seedExtras(st){
  const m=TODAY.slice(0,7),pm=monthAdd(m,-1),cur=b=>st.branches.find(x=>x.id===b).cur;
  st.cfg.targets=[];
  [pm,m].forEach(mm=>st.staff.filter(s=>s.role==='Counsellor').forEach(s=>{const inr=cur(s.branch)==='INR';st.cfg.targets.push({m:mm,c:s.id,enr:inr?4:6,rev:inr?240000:16000,conv:25})}));
  st.cfg.payTerms=[
    {id:'PT1',name:'Full payment',split:[100],gap:0,minFirst:100,grace:0,active:true},
    {id:'PT2',name:'50 / 50',split:[50,50],gap:30,minFirst:50,grace:7,active:true},
    {id:'PT3',name:'40 / 30 / 30',split:[40,30,30],gap:21,minFirst:40,grace:7,active:true},
    {id:'PT4',name:'Quarterly (4 × 25%)',split:[25,25,25,25],gap:90,minFirst:25,grace:10,active:true}];
  st.cfg.payTermDefault='PT1';
  st.cfg.refund={rules:[{label:'Cooling-off',days:7,sessions:2,pct:100},{label:'Early withdrawal',days:30,sessions:6,pct:75},{label:'Mid-term',days:60,sessions:12,pct:50},{label:'Late withdrawal',days:90,sessions:18,pct:25}],
    regFee:'retain',adminFee:{AED:100,INR:1500},tax:'refund',approver:'Management',confirmed:false};
  st.cfg.lms={validMonths:12,programmes:{},branchMap:{},confirmed:false};
  st.programs.forEach((p,i)=>{const code=p.id+'-TRK-'+(10021+i*1000);st.cfg.lms.programmes[p.id]={track:code,credits:[...Array(p.credits)].map((_,k)=>code+'-C'+(k+1))}});
  st.branches.forEach(b=>{st.cfg.lms.branchMap[b.id]=b.id+'01'});
  st.cfg.integ.lms={on:false,retryMax:3,retryMin:15,notify:'Admissions Head, System Administrator'};delete st.cfg.integ.moodle;
  const termOf={'EN-26-0002':'PT2','EN-26-0004':'PT3'};
  st.enr.forEach(e=>{e.term=termOf[e.id]||'PT1';e.sched=buildSched(st.cfg.payTerms.find(t=>t.id===e.term),e.total,e.date);const o=e.opp&&st.opps.find(x=>x.id===e.opp);e.cslr=o?o.cslr:null});
  st.ms.forEach(x=>{const e=st.enr.find(y=>y.id===x.enr),c=st.cfg.lms.programmes[e.prog];x.op='enrol';x.cid=c.track;x.credits=c.credits.slice();x.course=st.programs.find(p=>p.id===e.prog).name+' · '+e.pkg});
  st.refunds.forEach(r=>{Object.assign(r,{sessions:6,days:30,suggested:r.amt,rule:'Early withdrawal (75%)',exception:false,approverRole:'Management',note:''})});
}

/* ---------- counsellor targets ---------- */
function enrCslr(e){if(e.cslr)return e.cslr;const o=e.opp&&oppById(e.opp);return o?o.cslr:null}
function tgtAch(c,m){const es=S.enr.filter(e=>enrCslr(e)===c&&e.date.startsWith(m)&&e.status!=='Withdrawn');const ls=S.leads.filter(l=>l.cslr===c&&dayKey(l.enq).startsWith(m));return{enr:es.length,rev:r2(es.reduce((a,e)=>a+e.total-e.tax,0)),leads:ls.length,conv:ls.length?Math.round(es.length/ls.length*100):0}}
const tgtFor=(c,m)=>(S.cfg.targets||[]).find(t=>t.c===c&&t.m===m);
const pctN=(a,b)=>b?Math.round(a/b*100):0;
const achB=(a,t)=>{const p=pctN(a,t);return bdg(p+'%',!t?'':p>=100?'ok':p>=60?'warn':'crit')};
CFG.targets=()=>{const m=S.tgtMonth||curMonth(),T=S.cfg.targets||(S.cfg.targets=[]);const cs=S.staff.filter(s=>s.role==='Counsellor'&&s.status==='Active');
  const months=[...new Set(T.map(t=>t.m).concat([m,curMonth()]))].sort();
  const rows=cs.map(s=>{const t=tgtFor(s.id,m)||{enr:'',rev:'',conv:''},a=tgtAch(s.id,m),cur=brCur(s.branch);
    return`<tr><td><b>${esc(s.name)}</b><div class="muted xs">${esc(branchName(s.branch))}</div></td><td><input name="e_${s.id}" type="number" min="0" step="1" value="${esc(t.enr)}" aria-label="Enrolment target ${esc(s.name)}" style="width:80px"></td><td><input name="r_${s.id}" type="number" min="0" step="1" value="${esc(t.rev)}" aria-label="Revenue target ${esc(s.name)}" style="width:110px"> <span class="muted xs">${cur}</span></td><td><input name="v_${s.id}" type="number" min="0" max="100" step="1" value="${esc(t.conv)}" aria-label="Conversion target ${esc(s.name)}" style="width:70px"> %</td><td class="r num">${a.enr} ${t.enr!==''?achB(a.enr,+t.enr):''}</td><td class="r num">${money(a.rev,cur)} ${t.rev!==''?achB(a.rev,+t.rev):''}</td><td class="r num">${a.conv}% <span class="muted xs">(${a.leads} leads)</span></td></tr>`}).join('');
  const brs=S.branches.filter(b=>b.status==='Operating').map(b=>{const ts=cs.filter(s=>s.branch===b.id).map(s=>tgtFor(s.id,m)).filter(Boolean);const se=ts.reduce((a,t)=>a+(+t.enr||0),0),sr=ts.reduce((a,t)=>a+(+t.rev||0),0);const ok=se===b.tAdm&&sr===b.tRev;
    return[b.name,b.tAdm,se,money(b.tRev,b.cur),money(sr,b.cur),ok?bdg('Matches','ok'):bdg((se<b.tAdm||sr<b.tRev?'Below':'Above')+' branch target','warn')]});
  return card('Counsellor targets – '+esc(monthName(m)),`<div class="tb" style="border:0;padding:0 0 12px"><select data-change="tgtMonth" aria-label="Month">${months.map(x=>`<option value="${x}"${x===m?' selected':''}>${esc(monthName(x))}</option>`).join('')}</select><button class="btn sm" type="button" data-act="tgtCopy">Copy from ${esc(monthName(monthAdd(m,-1)))}</button><button class="btn sm" type="button" data-act="tgtNext">${ic('plus')} Add ${esc(monthName(monthAdd(m,1)))}</button><span class="muted xs" style="margin-left:auto">Revenue is in each counsellor’s branch currency, excluding tax.</span></div>`+
    cfgForm('targets',`<input type="hidden" name="m" value="${m}"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Counsellor</th><th>Enrolments</th><th>Revenue</th><th>Conversion</th><th class="r">Enrolled</th><th class="r">Revenue booked</th><th class="r">Conversion</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted xs">Achievement: enrolments completed from the counsellor’s opportunities in the month (withdrawn excluded); revenue = their enrolment value excluding tax; conversion = enrolments ÷ leads assigned in the month.</p>`,{ok:'Save targets'}))+
    '<div style="height:14px"></div>'+card('Compared with branch targets',table('tgb',[{h:'Branch',f:r=>esc(r[0])},{h:'Branch admissions target',f:r=>r[1],r:1},{h:'Sum of counsellor targets',f:r=>r[2],r:1},{h:'Branch revenue target',f:r=>r[3],r:1},{h:'Sum of counsellor revenue',f:r=>r[4],r:1},{h:'',f:r=>r[5]}],brs,{all:1}),{np:1})};
CHG.tgtMonth=el=>{S.tgtMonth=el.value;render()};
SUB.cfg_targets=(d,f)=>{const m=d.m,T=S.cfg.targets;const cs=S.staff.filter(s=>s.role==='Counsellor'&&s.status==='Active');
  for(const s of cs){const e=d['e_'+s.id],r=d['r_'+s.id],v=d['v_'+s.id];if(e===''&&r===''&&v==='')continue;if(!(+e>=0)||!(+r>=0)||!(+v>=0)||+v>100||!Number.isInteger(+e)){toast('Check the targets for '+s.name+': whole enrolments, revenue ≥ 0, conversion 0–100%','err');return}}

function tgtTile(u){const m=curMonth(),t=tgtFor(u.id,m);if(!t)return kpi('My monthly target','—','No target set for '+monthName(m),goA('reports',{rep:'r21'}));const a=tgtAch(u.id,m),cur=brCur(u.branch);
  return kpi('My monthly target',a.enr+' / '+t.enr,'Enrolments · revenue '+pctN(a.rev,t.rev)+'% of '+money(t.rev,cur)+' · conversion '+a.conv+'% / '+t.conv+'%',goA('reports',{rep:'r21'}),a.enr>=t.enr?'':pctN(a.enr,t.enr)<50?'warn':'')}

/* ---------- payment terms & instalments ---------- */
const termById=id=>(S.cfg.payTerms||[]).find(t=>t.id===id);
const termName=id=>(termById(id)||{name:'Full payment'}).name;
function buildSched(term,total,date){const sp=term&&term.split&&term.split.length?term.split:[100];let acc=0;return sp.map((p,i)=>{const last=i===sp.length-1,amt=last?r2(total-acc):r2(total*p/100);acc=r2(acc+amt);return{n:i+1,due:addDays(date,i*((term&&term.gap)||0)),pct:p,amt}})}
function instStatus(e){const term=termById(e.term),sch=e.sched&&e.sched.length?e.sched:buildSched(term,e.total,e.date),grace=term?(+term.grace||0):0;let left=e.paid;
  return sch.map(x=>{const paid=r2(Math.min(Math.max(left,0),x.amt));left=r2(left-paid);let st;
    if(paid>=x.amt-0.005)st='Paid';else if(e.status==='Withdrawn'||e.status==='Completed')st='Closed';else if(addDays(x.due,grace)<TODAY)st=paid>0?'Overdue (part paid)':'Overdue';else if(x.due<=TODAY)st=paid>0?'Partly paid':'Due';else st=paid>0?'Partly paid':'Upcoming';
    return Object.assign({},x,{paid,bal:r2(x.amt-paid),st,graceEnd:addDays(x.due,grace)})})}
const overdueInsts=()=>S.enr.filter(e=>inScope(e.branch)&&['Active','On Hold'].includes(e.status)).flatMap(e=>instStatus(e).filter(i=>/^Overdue/.test(i.st)).map(i=>({e,i})));
const INSTK={Paid:'ok',Due:'warn','Partly paid':'warn',Upcoming:'info',Closed:''};const instB=st=>bdg(st,st in INSTK?INSTK[st]:'crit');
function schedTable(rows,cur){const st=rows.length&&rows[0].st;return`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Instalment</th><th>Due</th><th class="r">Amount</th>${st?'<th class="r">Paid</th><th>Status</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.n} of ${rows.length} <span class="muted xs">(${r.pct}%)</span></td><td>${dayFmt(r.due)}</td><td class="r num">${money(r.amt,cur)}</td>${st?`<td class="r num">${money(r.paid,cur)}</td><td>${instB(r.st)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function instSummary(e){const r=instStatus(e),paid=r.filter(x=>x.st==='Paid').length,od=r.find(x=>/^Overdue/.test(x.st)),nx=r.find(x=>x.st!=='Paid'&&x.st!=='Closed');
  return`${paid}/${r.length} paid${od?' '+bdg('Overdue','crit'):''}<div class="muted xs">${esc(termName(e.term))}${nx&&!od?' · next '+dayFmt(nx.due)+' · '+money(nx.bal,e.cur):''}</div>`}
function instTile(){const o=overdueInsts();return kpi('Overdue instalments',o.length,Math.round(o.reduce((a,x)=>a+toAED(x.i.bal,x.e.cur),0)).toLocaleString('en-US')+' AED equivalent overdue',goA('reports',{rep:'r22'}),o.length?'crit':'')}
const termCheck=t=>{const sp=t.split;if(!t.name||!t.name.trim())return'Enter a name';if(!sp.length||sp.some(x=>!(x>0)))return'Each instalment must be more than 0%';if(Math.abs(sp.reduce((a,b)=>a+b,0)-100)>0.001)return'The split must add up to 100% (now '+r2(sp.reduce((a,b)=>a+b,0))+'%)';if(sp.length>12)return'At most 12 instalments';if(sp.length>1&&!(t.gap>=1))return'Days between instalments must be at least 1';if(!(t.minFirst>=0&&t.minFirst<=100))return'Minimum first instalment must be 0–100%';if(sp[0]<t.minFirst)return'The first instalment ('+sp[0]+'%) is below the minimum first instalment ('+t.minFirst+'%)';if(!(t.grace>=0))return'Grace days must be 0 or more';return''};
CFG.payTerms=()=>{const T=S.cfg.payTerms||[];const sample=T.find(t=>t.id===(S.ptPrev||S.cfg.payTermDefault))||T[0];
  return card('Payment terms',table('cpt',[{h:'Term',f:t=>`<b>${esc(t.name)}</b><div class="mono muted xs">${t.id}${t.id===S.cfg.payTermDefault?' · default':''}</div>`},{h:'Split',f:t=>t.split.join(' / ')+' %'},{h:'Days between',f:t=>t.split.length>1?t.gap:'—',r:1},{h:'Minimum first',f:t=>t.minFirst+'%',r:1},{h:'Grace days',f:t=>t.grace,r:1},{h:'Status',f:t=>bdg(t.active?'Active':'Inactive',t.active?'ok':'')},{h:'',f:t=>`<div class="row"><button class="btn sm" data-act="mPayTerm" data-id="${t.id}">Edit</button><button class="btn sm ghost" data-act="ptPrev" data-id="${t.id}">Preview</button></div>`}],T,{all:1}),{np:1,act:`<button class="btn sm primary" data-act="mPayTerm">${ic('plus')} Add payment term</button>`})+
  '<div style="height:14px"></div>'+card('Default and preview',cfgForm('ptDefault',`<div class="fgrid">${F('Default term in the enrolment form','def',{v:S.cfg.payTermDefault,opts:T.filter(t=>t.active).map(t=>[t.id,t.name])})}</div>`,{ok:'Save default'})+(sample?`<div class="sec">Example: ${esc(sample.name)} on AED 10,000.00 enrolled today</div>${schedTable(buildSched(sample,10000,TODAY),'AED')}<p class="muted xs">An instalment becomes overdue when it is unpaid ${sample.grace} day(s) after its due date. Payments are applied to the earliest instalment first.</p>`:''))};

SUB.payTerm=(d,f)=>{if(!need(f,d,['name','split']))return;const t={name:d.name.trim(),split:d.split.split(/[,\/ ]+/).filter(Boolean).map(Number),gap:+d.gap||0,minFirst:+d.minFirst||0,grace:+d.grace||0,active:d.active==='1'};const p=termCheck(t);if(p){setErr(f,'split',p);return}

/* ---------- refund rules ---------- */
const daysSince=day=>Math.max(0,Math.floor((Date.parse(TODAY+'T12:00:00Z')-Date.parse(day+'T12:00:00Z'))/864e5));
function refundCalc(e,days,sessions){const R=S.cfg.refund;const rule=R.rules.find(r=>days<=r.days&&sessions<=r.sessions)||null;const pct=rule?rule.pct:0;
  const net=r2(e.fee-e.disc),base=r2(net*pct/100),tax=R.tax==='refund'?r2(base*e.taxPct/100):0,reg=R.regFee==='refund'&&pct>0?r2(e.reg*(1+e.taxPct/100)):0,admin=pct>0?+(R.adminFee[e.cur]||0):0;
  const gross=r2(base+tax+reg-admin);return{rule,pct,net,base,tax,reg,admin,gross,suggested:r2(Math.max(0,Math.min(e.paid,gross))),paid:e.paid}}
function refundBox(e,c){return dl([['Rule applied',c.rule?esc(c.rule.label)+' – '+c.pct+'%':'No rule matches – 0%'],['Programme fee after discount',money(c.net,e.cur)],['Refundable share',money(c.base,e.cur)],['Tax on refundable share',money(c.tax,e.cur)],['Registration fee',c.reg?money(c.reg,e.cur):'Retained'],['Admin fee',c.admin?'− '+money(c.admin,e.cur):'—'],['Paid so far',money(c.paid,e.cur)],['Suggested refund',`<b>${money(c.suggested,e.cur)}</b>`]])}
CFG.refund=()=>{const R=S.cfg.refund;const rows=R.rules.map((r,i)=>`<tr><td>${i+1}</td><td><input name="l${i}" value="${esc(r.label)}" aria-label="Rule ${i+1} name" style="width:100%;min-width:140px"></td><td>≤ <input name="d${i}" type="number" min="0" value="${r.days}" aria-label="Rule ${i+1} days" style="width:70px"></td><td>≤ <input name="s${i}" type="number" min="0" value="${r.sessions}" aria-label="Rule ${i+1} sessions" style="width:70px"></td><td><input name="p${i}" type="number" min="0" max="100" value="${r.pct}" aria-label="Rule ${i+1} refund %" style="width:70px"> %</td><td><button class="btn sm ghost" type="button" data-act="rfDel" data-i="${i}" aria-label="Delete rule ${i+1}">${ic('x')}</button></td></tr>`).join('');
  return`<div class="banner">${ic('alert')}<span>${R.confirmed?'Refund rules confirmed by management.':'These refund values are <b>placeholders</b> and need business confirmation before go-live.'}</span></div>`+card('Refund rules',cfgForm('refund',`<p class="muted sm" style="margin:0 0 10px">Rules are checked in order; the first rule where both the days since enrolment and the sessions attended are within its limits applies. If none matches, the suggested refund is 0.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Rule</th><th>Days since enrolment</th><th>Sessions attended</th><th>Refund of programme fee</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="row" style="margin:8px 0 14px"><button class="btn sm" type="button" data-act="rfAdd">${ic('plus')} Add rule</button></div><div class="fgrid">${F('Registration fee','regFee',{v:R.regFee,opts:[['retain','Retained (not refunded)'],['refund','Refunded when any refund applies']]})}${F('Tax on the refundable share','tax',{v:R.tax,opts:[['refund','Refunded with the share'],['retain','Retained']]})}${F('Admin fee (AED)','aAED',{t:'number',min:0,v:R.adminFee.AED})}${F('Admin fee (INR)','aINR',{t:'number',min:0,v:R.adminFee.INR})}${F('Approver for refunds above the suggestion','approver',{v:R.approver,opts:ROLES.filter(r=>r!=='Counsellor')})}${F('Status','confirmed',{v:R.confirmed?'1':'0',opts:[['0','Placeholder – needs confirmation'],['1','Confirmed by management']]})}</div>`,{ok:'Save refund rules'}))+
  '<div style="height:14px"></div>'+card('Refund calculator',`<div class="fgrid" id="rfcForm">${F('Programme fee after discount','cfee',{t:'number',min:0,v:2000,inp:'rfCalc'})}${F('Tax %','ctax',{t:'number',min:0,v:5,inp:'rfCalc'})}${F('Registration fee','creg',{t:'number',min:0,v:100,inp:'rfCalc'})}${F('Paid so far','cpaid',{t:'number',min:0,v:2205,inp:'rfCalc'})}${F('Currency','ccur',{v:'AED',opts:['AED','INR'],chg:'rfCalc'})}${F('Days since enrolment','cdays',{t:'number',min:0,v:20,inp:'rfCalc'})}${F('Sessions attended','cses',{t:'number',min:0,v:4,inp:'rfCalc'})}</div><div id="rfcOut" style="margin-top:12px">${rfCalcOut()}</div>`)};
function rfCalcOut(){const g=n=>{const el=document.querySelector('#rfcForm [name='+n+']');return el?el.value:null};const v=(n,dflt)=>{const x=g(n);return x==null||x===''?dflt:+x};const cur=g('ccur')||'AED';
  const e={fee:v('cfee',2000),disc:0,taxPct:v('ctax',5),reg:v('creg',100),paid:v('cpaid',2205),cur};return refundBox(e,refundCalc(e,v('cdays',20),v('cses',4)))}
INP.rfCalc=()=>{const o=document.getElementById('rfcOut');if(o)o.innerHTML=rfCalcOut()};CHG.rfCalc=INP.rfCalc;
const rfRead=d=>{const R=S.cfg.refund,rules=[];for(let i=0;d['l'+i]!=null;i++)rules.push({label:String(d['l'+i]).trim(),days:+d['d'+i],sessions:+d['s'+i],pct:+d['p'+i]});return rules};
ACT.rfAdd=()=>{const f=document.querySelector('form[data-submit="cfg_refund"]');if(f)S.cfg.refund.rules=rfRead(fd(f));S.cfg.refund.rules.push({label:'New rule',days:120,sessions:24,pct:0});render()};
ACT.rfDel=d=>{const f=document.querySelector('form[data-submit="cfg_refund"]');if(f)S.cfg.refund.rules=rfRead(fd(f));S.cfg.refund.rules.splice(+d.i,1);render()};
SUB.cfg_refund=(d,f)=>{const rules=rfRead(d);for(const r of rules){if(!r.label||!(r.days>=0)||!(r.sessions>=0)||!(r.pct>=0&&r.pct<=100)){toast('Each rule needs a name, days and sessions ≥ 0 and a refund of 0–100%','err');return}}
  for(let i=1;i<rules.length;i++)if(rules[i].days<rules[i-1].days&&rules[i].sessions<rules[i-1].sessions){toast('Rule '+(i+1)+' is fully covered by rule '+i+' and would never apply – order rules from earliest to latest','err');return}
  if(!(+d.aAED>=0)||!(+d.aINR>=0)){toast('Admin fees must be 0 or more','err');return}
  Object.assign(S.cfg.refund,{rules,regFee:d.regFee,tax:d.tax,adminFee:{AED:+d.aAED,INR:+d.aINR},approver:d.approver,confirmed:d.confirmed==='1'});cfgSave('Refund rules',rules.map(r=>r.label+' '+r.pct+'%').join('; '))};

MODALS.withdraw=m=>{const e=enrById(m.id),s=stuById(e.stu),days=daysSince(e.date),c=refundCalc(e,days,0);c.suggested=r2(Math.max(0,c.suggested-priorRefunds(e)));return{title:'Withdraw – '+s.first+' '+s.last,form:'withdraw',ok:'Withdraw student',danger:1,body:`<input type="hidden" name="id" value="${e.id}"><div class="fgrid">${F('Reason','reason',{req:1,full:1})}${F('Sessions attended','sessions',{t:'number',min:0,step:1,v:0,req:1,inp:'wdCalc'})}${F('Days since enrolment','days',{v:days+' (enrolled '+fD(e.date+'T12:00:00+04:00')+')',dis:1})}${F('Refund requested ('+e.cur+')','amt',{t:'number',min:0,step:'0.01',v:c.suggested,inp:'wdCalc',help:'Paid so far: '+money(e.paid,e.cur)})}</div><div id="wdSug" style="margin-top:12px">${wdSugHtml(e,days,0,c.suggested)}</div><p class="muted sm">Enrolment and payment history stay available. The LMS is told to withdraw unused credits (cancel call). ${S.cfg.refund.confirmed?'':'Refund rules are placeholders pending business confirmation.'}</p>`}};
const priorRefunds=e=>S.refunds.filter(r=>r.enr===e.id&&r.status!=='Rejected').reduce((a,r)=>a+r.amt,0);
function wdSugHtml(e,days,ses,amt){const c=refundCalc(e,days,ses),prior=priorRefunds(e);if(prior>0)c.suggested=r2(Math.max(0,c.suggested-prior));const ex=amt>c.suggested+0.005;return card('Suggested refund',refundBox(e,c)+(ex?`<div class="banner" style="margin:10px 0 0;background:var(--warn-bg)">${ic('alert')}<span>The requested ${money(amt,e.cur)} is above the suggested ${money(c.suggested,e.cur)}. It will be recorded as an <b>exception</b> for ${esc(S.cfg.refund.approver)} to approve.</span></div>`:''))}
INP.wdCalc=el=>{const f=el.form,e=enrById(f.querySelector('[name=id]').value);const ses=+f.querySelector('[name=sessions]').value||0,amt=+f.querySelector('[name=amt]').value||0;const o=document.getElementById('wdSug');if(o)o.innerHTML=wdSugHtml(e,daysSince(e.date),ses,amt)};
SUB.withdraw=(d,f)=>{if(!need(f,d,['reason','sessions']))return;const e=enrById(d.id),amt=r2(+d.amt||0),ses=+d.sessions;if(!Number.isInteger(ses)||ses<0){setErr(f,'sessions','Enter the number of sessions attended');return}if(amt<0||amt>e.paid+0.005){setErr(f,'amt','Refund cannot exceed amount paid ('+money(e.paid,e.cur)+')');return}
  const days=daysSince(e.date),c=refundCalc(e,days,ses),prior=priorRefunds(e),sug=r2(Math.max(0,c.suggested-prior)),ex=amt>sug+0.005,R=S.cfg.refund;e.status='Withdrawn';
  if(amt>0){const r={id:'RF-26-'+String(S.seq.rf++).padStart(4,'0'),enr:e.id,amt,reason:d.reason,status:'Requested',at:nowIso(),by:me().name,byId:me().id,sessions:ses,days,suggested:sug,rule:c.rule?c.rule.label+' ('+c.pct+'%)':'No rule (0%)',exception:ex,approverRole:R.approver,note:ex?'Above the suggested refund – needs '+R.approver+' approval':''};S.refunds.push(r);
    if(ex)notify('pay','warn','Refund exception to approve: '+r.id+' – '+money(amt,e.cur)+' requested, '+money(sug,e.cur)+' suggested',{page:'refunds'},[R.approver],e.branch)}
  const s=stuById(e.stu),m={id:'MS-'+String(S.seq.ms++).padStart(3,'0'),enr:e.id,stu:s.id,op:'cancel',status:'Pending',mid:null,cid:(S.cfg.lms.programmes[e.prog]||{}).track||'—',credits:[],course:PNAME(e.prog)+' · '+e.pkg,mode:'cancel',last:nowIso(),err:'',attempts:0,hist:[{at:nowIso(),s:'Pending',msg:'Cancel call queued after withdrawal'}]};S.ms.push(m);
  addAudit('Enrolment withdrawn',e.id,d.reason+(amt>0?' · refund requested '+money(amt,e.cur)+(ex?' (exception)':''):''));closeModal();runSync(m.id);toast('Enrolment withdrawn – history retained'+(ex?'; refund sent for '+R.approver+' approval':''),'ok')};
PAGES.refunds=()=>{const es=S.enr.filter(e=>inScope(e.branch)&&e.status==='Withdrawn');const rf=S.refunds.filter(r=>inScope(enrById(r.enr).branch));const R=S.cfg.refund,u=me();
  const btn=(r,l)=>`<button class="btn sm" data-act="procRefund" data-id="${r.id}">${l}</button>`;
  const actFor=r=>{if(r.status!=='Requested')return'';if(r.exception){if(u.role!==r.approverRole)return`<span class="muted xs">Awaiting ${esc(r.approverRole)}</span>`;if(r.byId===u.id)return`<span class="muted xs">Requested by you – another ${esc(r.approverRole)} approves</span>`;return`<div class="row">${btn(r,'Approve & mark processed')}<button class="btn sm ghost" data-act="rejRefund" data-id="${r.id}">Reject</button></div>`}return can('payments','E')?`<div class="row">${btn(r,'Mark processed')}<button class="btn sm ghost" data-act="rejRefund" data-id="${r.id}">Reject</button></div>`:''};
  return ph('Refunds & Withdrawals','Withdrawn enrolments and refund requests')+`<div class="banner">${ic('alert')}<span>Refunds are suggested from the refund rules (Settings → Refund Rules)${R.confirmed?'':', which are placeholders pending business confirmation'}. A request above the suggestion is an exception and needs ${esc(R.approver)} approval. Pay the refund through your bank or gateway, then mark it processed.</span></div>`+card('Refund requests',table('rf',[{h:'Request',f:r=>r.id},{h:'Student',f:r=>{const e=enrById(r.enr),s=stuById(e.stu);return`<a ${sgo(s.id)}>${esc(s.first+' '+s.last)}</a>`}},{h:'Enrolment',f:r=>r.enr},{h:'Requested',f:r=>money(r.amt,enrById(r.enr).cur),r:1},{h:'Suggested',f:r=>r.suggested!=null?money(r.suggested,enrById(r.enr).cur):'—',r:1},{h:'Rule',f:r=>esc(r.rule||'—')+(r.sessions!=null?`<div class="muted xs">${r.days} days · ${r.sessions} sessions</div>`:'')},{h:'Reason',f:r=>esc(r.reason)},{h:'Requested by',f:r=>fDT(r.at)+' · '+esc(r.by)},{h:'Status',f:r=>bdg(r.status,/^Processed/.test(r.status)?'ok':'warn')+(r.exception?' '+bdg('Exception','crit'):'')},{h:'',f:actFor}],rf,{all:1,et:'No refund requests'}),{np:1})+'<div style="height:14px"></div>'+card('Withdrawn enrolments',table('wd',enrCols(0),es,{all:1,et:'None'}),{np:1})};
ACT.rejRefund=d=>{const r=S.refunds.find(x=>x.id===d.id),u=me();r.status='Rejected';r.rejectedBy=u.name;r.rejectedAt=nowIso();addAudit('Refund rejected',r.id,money(r.amt,enrById(r.enr).cur));render();toast('Refund request rejected','ok')};
ACT.procRefund=d=>{const r=S.refunds.find(x=>x.id===d.id),u=me();if(r.exception&&(u.role!==r.approverRole||r.byId===u.id)){toast('Another '+r.approverRole+' must approve this refund exception','err');return}r.status='Processed';r.processedBy=u.name;r.processedAt=nowIso();addAudit(r.exception?'Refund exception approved':'Refund processed',r.id,money(r.amt,enrById(r.enr).cur));render();toast('Refund marked processed','ok')};

function lmsPayload(e){const s=stuById(e.stu),p=(s.parents||[])[0]||{},L=S.cfg.lms,prog=S.programs.find(x=>x.id===e.prog)||{name:e.prog},code=L.programmes[e.prog]||{};
  return{reference:e.id,student_id:s.id,student_first_name:s.first,student_last_name:s.last,student_email:s.email||p.email||'',student_phone:s.mobile||p.mobile||'',student_dob:s.dob||'',parent_id:s.fam||'',parent_name:p.name||'',parent_email:p.email||'',parent_phone:p.mobile||'',branch:L.branchMap[e.branch]||'',valid_until:addDays(addMonthsDay(e.date,+L.validMonths||12),-1),products:[{product_name:prog.name+' – '+e.pkg,track:code.track||'',credits:(code.credits||[]).slice()}]}}
